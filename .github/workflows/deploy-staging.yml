name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  PROJECT_ID: rodeo-app-fac50
  REGION: southamerica-east1
  SERVICE_NAME: rodeo-staging
  REGISTRY: southamerica-east1-docker.pkg.dev
  # Dynamic image name including the commit SHA
  IMAGE: southamerica-east1-docker.pkg.dev/rodeo-app-fac50/rodeo-images/rodeo-frontend:${{ github.sha }}
  STAGING_URL: https://staging.rodeoagtech.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1 y 2. Autenticación y configuración en Google Cloud usando gcloud directamente
      - name: 'Authenticate to Google Cloud'
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
          gcloud config set project ${{ env.PROJECT_ID }}


      # 3. Autenticación de Docker a Artifact Registry
      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 4. Setup Node y ejecutar migraciones de DB
      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Setup Cloud SQL Auth Proxy'
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-preprod &
          sleep 5

      - name: 'Run Database Migrations & Seeds'
        run: |
          cd frontend
          npm ci
          # Forzar conexión por el Cloud SQL Proxy local (127.0.0.1:5432) en lugar de IP pública
          PROXIED_URL=$(echo "$MIGRATION_DATABASE_URL" | sed -E 's/@[^:]+:[0-9]+/@127.0.0.1:5432/')
          
          node scripts/full_schema_migration.js "$PROXIED_URL"
          node scripts/setup_rls_roles.js "$PROXIED_URL"
          DATABASE_URL="$PROXIED_URL" node insert_terms_v3.js
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # 4. Construir la imagen local de Docker
      - name: 'Build Docker Image'
        run: |-
          # El contexto (directorio) donde está el frontend
          cd frontend
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.STAGING_URL }}" \
            -t ${{ env.IMAGE }} \
            .

      # 5. Push de la imagen a Artifact Registry
      - name: 'Push Docker Image'
        run: |-
          docker push ${{ env.IMAGE }}

      # 6. Generar env vars YAML (evita truncado de = en base64 con --set-env-vars)
      - name: 'Generate env vars YAML'
        run: |-
          python3 - <<'PYEOF'
          import os, json
          from urllib.parse import urlparse, urlencode, parse_qs
          def q(v): return json.dumps(str(v))

          # ── Transform DATABASE_URL to use Cloud SQL Unix socket ──
          CLOUD_SQL_INSTANCE = os.environ.get("CLOUD_SQL_INSTANCE", "")
          def to_socket_url(url_str):
              if not url_str or not CLOUD_SQL_INSTANCE:
                  return url_str
              if 'host=' in url_str:
                  return url_str  # Already using socket format
              parsed = urlparse(url_str.replace('postgresql://', 'http://'))
              db_path = parsed.path.split('?')[0]
              creds = f"{parsed.username}:{parsed.password}" if parsed.password else parsed.username
              socket_url = f"postgresql://{creds}@localhost:{parsed.port or 5432}{db_path}?host=/cloudsql/{CLOUD_SQL_INSTANCE}"
              return socket_url

          staging_url = os.environ.get("STAGING_URL", "")
          db_url = to_socket_url(os.environ.get("DATABASE_URL", ""))
          db_url_service = to_socket_url(os.environ.get("DATABASE_URL_SERVICE", ""))
          lines = [
            f'NODE_ENV: production',
            f'NEXT_PUBLIC_APP_URL: {q(staging_url)}',
            f'DATABASE_URL: {q(db_url)}',
            f'DATABASE_URL_SERVICE: {q(db_url_service)}',
            f'FIREBASE_ADMIN_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            # FIREBASE_ADMIN_CREDENTIALS_BASE64 se monta via Secret Manager (ver --set-secrets abajo)
            f'FIREBASE_ADMIN_IMPERSONATE_SA: {q(os.environ.get("FIREBASE_ADMIN_IMPERSONATE_SA",""))}',
            f'FIREBASE_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            f'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: {q(os.environ.get("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",""))}',
            f'GCS_BUCKET_NAME: {q(os.environ.get("GCS_BUCKET_NAME",""))}',
            f'GEMINI_API_KEY: {q(os.environ.get("GEMINI_API_KEY",""))}',
            f'RESEND_API_KEY: {q(os.environ.get("RESEND_API_KEY",""))}',
            f'RESEND_FROM_EMAIL: {q(os.environ.get("RESEND_FROM_EMAIL",""))}',
            f'MERCADOPAGO_ACCESS_TOKEN: {q(os.environ.get("MERCADOPAGO_ACCESS_TOKEN",""))}',
            f'NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: {q(os.environ.get("NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY",""))}',
            f'TITILER_URL: {q(os.environ.get("TITILER_URL",""))}',
            f'EMAIL_VERIFY_JWT_SECRET: {q(os.environ.get("EMAIL_VERIFY_JWT_SECRET",""))}',
            f'CONTACT_FORM_DESTINATION_EMAILS: {q(os.environ.get("CONTACT_FORM_DESTINATION_EMAILS",""))}',
            f'CRON_SECRET: {q(os.environ.get("CRON_SECRET",""))}',
          ]
          with open('/tmp/rodeo-staging-env.yaml','w') as f: f.write('\n'.join(lines))
          print('  ✓ /tmp/rodeo-staging-env.yaml generado')
          PYEOF
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          CLOUD_SQL_INSTANCE: ${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-preprod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SERVICE: ${{ secrets.DATABASE_URL_SERVICE }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_ADMIN_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_BASE64 }}
          FIREBASE_ADMIN_IMPERSONATE_SA: ${{ secrets.FIREBASE_ADMIN_IMPERSONATE_SA }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY }}
          TITILER_URL: ${{ secrets.TITILER_URL }}
          EMAIL_VERIFY_JWT_SECRET: ${{ secrets.EMAIL_VERIFY_JWT_SECRET }}
          CONTACT_FORM_DESTINATION_EMAILS: ${{ secrets.CONTACT_FORM_DESTINATION_EMAILS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # 7. Despliegue en Cloud Run
      - name: 'Deploy to Cloud Run'
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-preprod \
            --env-vars-file=/tmp/rodeo-staging-env.yaml \
            --set-secrets=FIREBASE_ADMIN_CREDENTIALS_BASE64=FIREBASE_ADMIN_CREDENTIALS_BASE64:latest \
            --quiet

      - name: 'Deploy to Firebase (Rules & Hosting)'
        run: |-
          # Inject hosting config into firebase.json to route all traffic to the Cloud Run service
          jq '. + {"hosting": {"public": "public", "rewrites": [{"source": "**", "run": {"serviceId": "${{ env.SERVICE_NAME }}", "region": "${{ env.REGION }}"}}]}}' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json
          mkdir -p public && touch public/.gitkeep
          date > public/deploy_time.txt # Prevent "current active version" 400 error
          npm install -g firebase-tools
          # firebase-tools doesn't read GOOGLE_APPLICATION_CREDENTIALS — use gcloud access token
          FIREBASE_TOKEN=$(gcloud auth print-access-token)
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }} --token "$FIREBASE_TOKEN" || true
