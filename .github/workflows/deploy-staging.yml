name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  PROJECT_ID: rodeo-app-fac50
  REGION: southamerica-east1
  SERVICE_NAME: rodeo-staging
  REGISTRY: southamerica-east1-docker.pkg.dev
  # Dynamic image name including the commit SHA
  IMAGE: southamerica-east1-docker.pkg.dev/rodeo-app-fac50/rodeo-images/rodeo-frontend:${{ github.sha }}
  STAGING_URL: https://rodeo-staging-831756494147.southamerica-east1.run.app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1 y 2. Autenticación y configuración en Google Cloud usando gcloud directamente
      - name: 'Authenticate to Google Cloud'
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/gcp_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
          gcloud config set project ${{ env.PROJECT_ID }}


      # 3. Autenticación de Docker a Artifact Registry
      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 4. Construir la imagen local de Docker
      - name: 'Build Docker Image'
        run: |-
          # El contexto (directorio) donde está el frontend
          cd frontend
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.STAGING_URL }}" \
            -t ${{ env.IMAGE }} \
            .

      # 5. Push de la imagen a Artifact Registry
      - name: 'Push Docker Image'
        run: |-
          docker push ${{ env.IMAGE }}

      # 6. Generar env vars YAML (evita truncado de = en base64 con --set-env-vars)
      - name: 'Generate env vars YAML'
        run: |-
          python3 - <<'PYEOF'
          import os, json
          def q(v): return json.dumps(str(v))
          staging_url = os.environ.get("STAGING_URL", "")
          lines = [
            f'NODE_ENV: production',
            f'NEXT_PUBLIC_APP_URL: {q(staging_url)}',
            f'DATABASE_URL: {q(os.environ.get("DATABASE_URL",""))}',
            f'FIREBASE_ADMIN_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            f'FIREBASE_ADMIN_CREDENTIALS_BASE64: {q(os.environ.get("FIREBASE_ADMIN_CREDENTIALS_BASE64",""))}',
            f'FIREBASE_ADMIN_IMPERSONATE_SA: {q(os.environ.get("FIREBASE_ADMIN_IMPERSONATE_SA",""))}',
            f'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: {q(os.environ.get("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",""))}',
            f'GCS_BUCKET_NAME: {q("rodeo-media")}',
            f'GEMINI_API_KEY: {q(os.environ.get("GEMINI_API_KEY",""))}',
            f'RESEND_API_KEY: {q(os.environ.get("RESEND_API_KEY",""))}',
            f'RESEND_FROM_EMAIL: {q(os.environ.get("RESEND_FROM_EMAIL",""))}',
            f'TITILER_URL: {q(os.environ.get("TITILER_URL",""))}',
          ]
          with open('/tmp/rodeo-staging-env.yaml','w') as f: f.write('\n'.join(lines))
          print('  ✓ /tmp/rodeo-staging-env.yaml generado')
          PYEOF
        env:
          STAGING_URL: ${{ env.STAGING_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_ADMIN_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_BASE64 }}
          FIREBASE_ADMIN_IMPERSONATE_SA: ${{ secrets.FIREBASE_ADMIN_IMPERSONATE_SA }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TITILER_URL: ${{ secrets.TITILER_URL }}

      # 7. Despliegue en Cloud Run
      - name: 'Deploy to Cloud Run'
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --env-vars-file=/tmp/rodeo-staging-env.yaml \
            --quiet
