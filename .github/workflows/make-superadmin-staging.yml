name: Make Superadmin (Staging)
on: workflow_dispatch
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install pg firebase-admin dotenv
        working-directory: frontend
      - run: node scripts/create_superadmin_full.js
        working-directory: frontend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_ADMIN_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_BASE64 }}
