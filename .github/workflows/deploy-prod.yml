name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: rodeo-app-prod-v1
  REGION: southamerica-east1
  SERVICE_NAME: rodeo-prod
  REGISTRY: southamerica-east1-docker.pkg.dev
  IMAGE: southamerica-east1-docker.pkg.dev/rodeo-app-prod-v1/rodeo-images/rodeo-frontend:${{ github.sha }}
  PROD_URL: https://rodeoagtech.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        run: |
          echo '${{ secrets.GCP_CREDENTIALS_PROD }}' > /tmp/gcp_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
          gcloud config set project ${{ env.PROJECT_ID }}

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Setup Proxy & Run Database Migrations'
        continue-on-error: true
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "⚠️  MIGRATION_DATABASE_URL_PROD no configurado — saltando migraciones"
            exit 0
          fi

          # ── 1. Descargar Cloud SQL Auth Proxy ──────────────────────────────────
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

          # ── 2. Iniciar proxy en background (mismo shell → vive durante las migs) ─
          ./cloud-sql-proxy ${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-prod \
            --address 127.0.0.1 --port 5432 \
            --credentials-file /tmp/gcp_key.json \
            > /tmp/cloudsql-proxy.log 2>&1 &
          PROXY_PID=$!

          # ── 3. Esperar hasta que el puerto esté disponible (máx 30 seg) ────────
          echo "Esperando Cloud SQL Proxy en 127.0.0.1:5432..."
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5432 2>/dev/null; then
              echo "✅ Proxy listo (${i}s)"; break
            fi
            if ! kill -0 $PROXY_PID 2>/dev/null; then
              echo "❌ Proxy terminó inesperadamente. Log:"; cat /tmp/cloudsql-proxy.log; exit 1
            fi
            echo "  Esperando... (${i}s)"; sleep 1
          done
          if ! nc -z 127.0.0.1 5432 2>/dev/null; then
            echo "❌ Proxy no respondió en 30s. Log:"; cat /tmp/cloudsql-proxy.log; exit 1
          fi

          # ── 4. Construir URL con 127.0.0.1 ────────────────────────────────────
          cd frontend
          npm ci
          PROXIED_URL=$(node -e "
            const raw = process.env.MIGRATION_DATABASE_URL;
            if (!raw) { console.error('MIGRATION_DATABASE_URL no definida'); process.exit(1); }
            try {
              const u = new URL(raw);
              u.hostname = '127.0.0.1';
              u.port = '5432';
              // Cloud SQL Proxy maneja el cifrado internamente;
              // deshabilitar SSL en el cliente evita ECONNRESET
              u.searchParams.set('sslmode', 'disable');
              console.log(u.toString());
            } catch(e) { console.error('URL inválida:', e.message); process.exit(1); }
          ")
          echo "✅ PROXIED_URL → 127.0.0.1:5432"

          # ── 5. Ejecutar migraciones ────────────────────────────────────────────
          node scripts/full_schema_migration.js "$PROXIED_URL" \
            && echo "✅ full_schema_migration OK" \
            || echo "⚠️  full_schema_migration falló — verificar secret MIGRATION_DATABASE_URL_PROD"
          node scripts/setup_rls_roles.js "$PROXIED_URL" \
            && echo "✅ setup_rls_roles OK" \
            || echo "⚠️  setup_rls_roles falló"
          DATABASE_URL="$PROXIED_URL" node insert_terms_v3.js \
            && echo "✅ insert_terms_v3 OK" \
            || echo "⚠️  insert_terms_v3 falló"

          # ── 6. Apagar proxy limpiamente ────────────────────────────────────────
          kill $PROXY_PID 2>/dev/null || true
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL_PROD }}

      - name: 'Build Docker Image'
        run: |-
          cd frontend
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_PROD }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.PROD_URL }}" \
            -t ${{ env.IMAGE }} \
            .

      - name: 'Push Docker Image'
        run: |-
          docker push ${{ env.IMAGE }}

      - name: 'Generate env vars YAML'
        run: |-
          python3 - <<'PYEOF'
          import os, json
          from urllib.parse import urlparse, urlencode, parse_qs
          def q(v): return json.dumps(str(v))

          # ── Transform DATABASE_URL to use Cloud SQL Unix socket ──
          # If the URL already contains ?host= (socket path), leave it as-is.
          # Otherwise, rewrite host→localhost and append the socket path so
          # Cloud Run connects through the Cloud SQL Connector sidecar.
          CLOUD_SQL_INSTANCE = os.environ.get("CLOUD_SQL_INSTANCE", "")
          def to_socket_url(url_str):
              if not url_str or not CLOUD_SQL_INSTANCE:
                  return url_str
              if 'host=' in url_str:
                  return url_str  # Already using socket format
              parsed = urlparse(url_str.replace('postgresql://', 'http://'))
              db_path = parsed.path.split('?')[0]  # e.g. /rodeo_main
              creds = f"{parsed.username}:{parsed.password}" if parsed.password else parsed.username
              socket_url = f"postgresql://{creds}@localhost:{parsed.port or 5432}{db_path}?host=/cloudsql/{CLOUD_SQL_INSTANCE}"
              return socket_url

          prod_url = os.environ.get("PROD_URL", "")
          db_url = to_socket_url(os.environ.get("DATABASE_URL", ""))
          db_url_service = to_socket_url(os.environ.get("DATABASE_URL_SERVICE", ""))
          lines = [
            f'NODE_ENV: production',
            f'NEXT_PUBLIC_APP_URL: {q(prod_url)}',
            f'DATABASE_URL: {q(db_url)}',
            f'DATABASE_URL_SERVICE: {q(db_url_service)}',
            f'FIREBASE_ADMIN_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            # FIREBASE_ADMIN_CREDENTIALS_BASE64 se monta via Secret Manager (ver --set-secrets abajo)
            f'FIREBASE_ADMIN_IMPERSONATE_SA: {q(os.environ.get("FIREBASE_ADMIN_IMPERSONATE_SA",""))}',
            f'FIREBASE_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            f'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: {q(os.environ.get("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",""))}',
            f'GCS_BUCKET_NAME: {q(os.environ.get("GCS_BUCKET_NAME",""))}',
            f'GEMINI_API_KEY: {q(os.environ.get("GEMINI_API_KEY",""))}',
            f'RESEND_API_KEY: {q(os.environ.get("RESEND_API_KEY",""))}',
            f'RESEND_FROM_EMAIL: {q(os.environ.get("RESEND_FROM_EMAIL",""))}',
            f'MERCADOPAGO_ACCESS_TOKEN: {q(os.environ.get("MERCADOPAGO_ACCESS_TOKEN",""))}',
            f'NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: {q(os.environ.get("NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY",""))}',
            f'TITILER_URL: {q(os.environ.get("TITILER_URL",""))}',
            f'EMAIL_VERIFY_JWT_SECRET: {q(os.environ.get("EMAIL_VERIFY_JWT_SECRET",""))}',
            f'CONTACT_FORM_DESTINATION_EMAILS: {q(os.environ.get("CONTACT_FORM_DESTINATION_EMAILS",""))}',
            f'CRON_SECRET: {q(os.environ.get("CRON_SECRET",""))}',
            f'MERCADOPAGO_WEBHOOK_SECRET: {q(os.environ.get("MERCADOPAGO_WEBHOOK_SECRET",""))}',
          ]
          with open('/tmp/rodeo-prod-env.yaml','w') as f: f.write('\n'.join(lines))
          print('  ✓ /tmp/rodeo-prod-env.yaml generado')
          PYEOF
        env:
          PROD_URL: ${{ env.PROD_URL }}
          CLOUD_SQL_INSTANCE: ${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-prod
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_SERVICE: ${{ secrets.DATABASE_URL_SERVICE_PROD }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_ADMIN_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_BASE64_PROD }}
          FIREBASE_ADMIN_IMPERSONATE_SA: ${{ secrets.FIREBASE_ADMIN_IMPERSONATE_SA_PROD }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME_PROD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PROD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL_PROD }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN_PROD }}
          NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_PROD }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET_PROD }}
          TITILER_URL: ${{ secrets.TITILER_URL_PROD }}
          EMAIL_VERIFY_JWT_SECRET: ${{ secrets.EMAIL_VERIFY_JWT_SECRET_PROD }}
          CONTACT_FORM_DESTINATION_EMAILS: ${{ secrets.CONTACT_FORM_DESTINATION_EMAILS_PROD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_PROD }}

      - name: 'Clear legacy Cloud Run secret bindings'
        run: |-
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --clear-secrets \
            --clear-env-vars \
            --quiet || true

      - name: 'Deploy to Cloud Run'
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:rodeo-db-prod \
            --env-vars-file=/tmp/rodeo-prod-env.yaml \
            --set-secrets=FIREBASE_ADMIN_CREDENTIALS_BASE64=FIREBASE_ADMIN_CREDENTIALS_BASE64:latest \
            --quiet

      - name: 'Deploy to Firebase (Rules & Hosting)'
        run: |-
          # Inject hosting config into firebase.json to route all traffic to the Cloud Run service
          jq '. + {"hosting": {"public": "public", "rewrites": [{"source": "**", "run": {"serviceId": "${{ env.SERVICE_NAME }}", "region": "${{ env.REGION }}"}}]}}' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json
          mkdir -p public && touch public/.gitkeep
          date > public/deploy_time.txt # Prevent "current active version" 400 error
          npm install -g firebase-tools
          # firebase-tools doesn't read GOOGLE_APPLICATION_CREDENTIALS — use gcloud access token
          FIREBASE_TOKEN=$(gcloud auth print-access-token)
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }} --token "$FIREBASE_TOKEN" || true
