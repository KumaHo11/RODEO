name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: rodeo-app-prod-v1
  REGION: southamerica-east1
  SERVICE_NAME: rodeo-prod
  REGISTRY: southamerica-east1-docker.pkg.dev
  IMAGE: southamerica-east1-docker.pkg.dev/rodeo-app-prod-v1/rodeo-images/rodeo-frontend:${{ github.sha }}
  PROD_URL: https://rodeoagtech.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        run: |
          echo '${{ secrets.GCP_CREDENTIALS_PROD }}' > /tmp/gcp_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
          gcloud config set project ${{ env.PROJECT_ID }}

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Run Database Migrations & Seeds'
        run: |
          cd frontend
          npm ci
          npx prisma db push --skip-generate
          node scripts/add_missing_columns.js "$DATABASE_URL"
          node insert_terms_v3.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: 'Build Docker Image'
        run: |-
          cd frontend
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_PROD }}" \
            --build-arg NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_PROD }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ env.PROD_URL }}" \
            -t ${{ env.IMAGE }} \
            .

      - name: 'Push Docker Image'
        run: |-
          docker push ${{ env.IMAGE }}

      - name: 'Generate env vars YAML'
        run: |-
          python3 - <<'PYEOF'
          import os, json
          def q(v): return json.dumps(str(v))
          prod_url = os.environ.get("PROD_URL", "")
          lines = [
            f'NODE_ENV: production',
            f'NEXT_PUBLIC_APP_URL: {q(prod_url)}',
            f'DATABASE_URL: {q(os.environ.get("DATABASE_URL",""))}',
            f'FIREBASE_ADMIN_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            f'FIREBASE_ADMIN_CREDENTIALS_BASE64: {q(os.environ.get("FIREBASE_ADMIN_CREDENTIALS_BASE64",""))}',
            f'FIREBASE_ADMIN_IMPERSONATE_SA: {q(os.environ.get("FIREBASE_ADMIN_IMPERSONATE_SA",""))}',
            f'FIREBASE_PROJECT_ID: {q(os.environ.get("FIREBASE_ADMIN_PROJECT_ID",""))}',
            f'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: {q(os.environ.get("NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",""))}',
            f'GCS_BUCKET_NAME: {q(os.environ.get("GCS_BUCKET_NAME",""))}',
            f'GEMINI_API_KEY: {q(os.environ.get("GEMINI_API_KEY",""))}',
            f'RESEND_API_KEY: {q(os.environ.get("RESEND_API_KEY",""))}',
            f'RESEND_FROM_EMAIL: {q(os.environ.get("RESEND_FROM_EMAIL",""))}',
            f'MERCADOPAGO_ACCESS_TOKEN: {q(os.environ.get("MERCADOPAGO_ACCESS_TOKEN",""))}',
            f'NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: {q(os.environ.get("NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY",""))}',
            f'TITILER_URL: {q(os.environ.get("TITILER_URL",""))}',
            f'EMAIL_VERIFY_JWT_SECRET: {q(os.environ.get("EMAIL_VERIFY_JWT_SECRET",""))}',
            f'CONTACT_FORM_DESTINATION_EMAILS: {q(os.environ.get("CONTACT_FORM_DESTINATION_EMAILS",""))}',
          ]
          with open('/tmp/rodeo-prod-env.yaml','w') as f: f.write('\n'.join(lines))
          print('  ✓ /tmp/rodeo-prod-env.yaml generado')
          PYEOF
        env:
          PROD_URL: ${{ env.PROD_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_ADMIN_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_BASE64_PROD }}
          FIREBASE_ADMIN_IMPERSONATE_SA: ${{ secrets.FIREBASE_ADMIN_IMPERSONATE_SA_PROD }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PROD }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME_PROD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PROD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL_PROD }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN_PROD }}
          NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY_PROD }}
          TITILER_URL: ${{ secrets.TITILER_URL_PROD }}
          EMAIL_VERIFY_JWT_SECRET: ${{ secrets.EMAIL_VERIFY_JWT_SECRET_PROD }}
          CONTACT_FORM_DESTINATION_EMAILS: ${{ secrets.CONTACT_FORM_DESTINATION_EMAILS_PROD }}

      - name: 'Deploy to Cloud Run'
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --env-vars-file=/tmp/rodeo-prod-env.yaml \
            --quiet

      - name: 'Deploy to Firebase (Rules & Hosting)'
        run: |-
          # Inject hosting config into firebase.json to route all traffic to the Cloud Run service
          jq '. + {"hosting": {"public": "public", "rewrites": [{"source": "**", "run": {"serviceId": "${{ env.SERVICE_NAME }}", "region": "${{ env.REGION }}"}}]}}' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json
          mkdir -p public && touch public/.gitkeep
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }}
