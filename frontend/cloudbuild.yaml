  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '831756494147'
  _NEXT_PUBLIC_FIREBASE_APP_ID: '1:831756494147:web:f44ee06a1ea03b2ba23bf6'
  _NEXT_PUBLIC_APP_URL: 'https://rodeoagtech.com'
  _NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: 'APP_USR-1348e448-d097-4e65-adc7-9639cfa8b41b'
